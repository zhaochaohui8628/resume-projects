## 施工方案合规审查 · 运行配置
# 说明：目前只有 agent/src/tools/rag_client.py 会读本文件（retrieval.* 段）。
#       其余段落为项目说明性配置，改这里不影响已训练产物。

project:
  name: 施工方案合规审查
  owner: 面试简历项目

llm:
  provider: mock            # mock（无需 Key，确定性输出） | deepseek（需 DEEPSEEK_API_KEY）
  deepseek:
    model: deepseek-chat
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY

retrieval:
  top_k: 5                  # 最终返回条文数
  rag2:                     # ★ 现行检索后端（唯一），rag_client._build_rag2 读取
    fuse_mode: rrf          # rrf | convex（用户裁定 RRF；convex 需配 alpha）
    alpha: 0.3              # fuse_mode=convex 时的向量路权重（凸组合前已做温莎截断 min-max 归一）
  rerank:                   # ★ CrossEncoder 精排（默认开，UI 可关）
    enabled: true
    model: rag2/data/models/cross_v2_ep4   # 领域微调 CE 产物（相对工作区根）
    oversample: 4           # 召回 top_k*oversample -> 精排 -> 截断回 top_k
    batch_size: 16
    max_len: 256

resources:                        # ★ 重型模型并发槽位（防瞬时提交内存超限 → WinError 1455）
  model_slots: 2                  # 同进程最多并发的重型模型调用数（NER 加载/推理、CE 加载/推理各占 1）
  slot_timeout: 180               # 等待槽位超时（秒）；超时抛 SlotTimeout。设 0/null = 无限等待

# ============================================================================
# 并发与限流（2026-09-16 依据实测定档）
# 实测基线（本机 16GB RAM / RTX 4060 Ti，样本=真实方案片段）：
#   并发 1（含模型冷启动）20.22s ｜ 峰值 3630 MB
#   并发 2               2.66s ｜ 单任务 1.33s ｜ 峰值 3439 MB
#   并发 3               2.90s ｜ 单任务 0.97s ｜ 峰值 3615 MB
# 结论：模型常驻约 3.4GB，且**模型是共享的**——并发 1→3 内存仅 +190MB，
#       增量成本极低；真正的约束是"模型常驻 + 历史 OOM（WinError 1455）"，
#       不是吞吐。故并发取保守档，由 model_slots 兜底内存安全。
# ============================================================================
concurrency:
  # ---- 任务队列（UI /api/tasks 准入）----
  queue_max: 8              # 允许积压的最大任务数（含正在执行的）；
                            # 超限直接返回 429「系统繁忙」，避免无限积压拖垮内存。
                            # 依据：并发 3 × 单任务约 1-3s（含 LLM 时 10-30s），
                            #       8 条积压最坏等待约 80s，超出体验已不可接受。
  task_concurrency: 3       # 同进程同时执行的编排任务数（信号量准入）。
                            # 依据：并发 3 实测峰值 3615MB，距 OOM 阈值仍有余量；
                            #       再往上收益递减（单任务耗时已降到 0.97s），风险上升。
  # ---- LLM 令牌桶（外部 API 限流，防打爆 DeepSeek）----
  llm_rate: 3.0             # 补充速率（tokens/sec）= 稳态每秒最多 3 次 LLM 请求。
                            # 依据：并发 3 × 每任务约 2-8 次 LLM 调用（路由/汇总/ReAct），
                            #       桶把它们平滑到 3 QPS 内，远低于 DeepSeek 限流阈值；
                            #       设 0 = 不限流（不推荐）。
  llm_burst: 6              # 桶容量（允许的瞬时突发量）；首轮无等待即可连发 6 次。
                            # 依据：= task_concurrency × 2，保证 3 个任务的首轮调用不被卡。
  # ---- 单任务内部 ----
  max_concurrency: 3        # 异步流水线内 subagent 并发上限（v7 实际只有 review/qa 两个，
                            # 3 留出余量；与 task_concurrency 保持一致便于推算）
  subagent_timeout: 120     # 单 subagent 超时（秒）；0 = 不限。
                            # 依据：单任务实测 1-3s（无 LLM）/ 10-30s（带 LLM），
                            #       120s 足以覆盖极端长方案，又能防死等。
